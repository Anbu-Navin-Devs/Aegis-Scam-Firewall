version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: aegis_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aegis
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aegis"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aegis_web
    restart: always
    ports:
      - "8000:8000"
    environment:
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/aegis
      - ENV=production
      - DEBUG=False
      - AEGIS_API_KEY=${AEGIS_API_KEY}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
